name: codex-compat-check

on:
  schedule:
    - cron: '30 1 * * *'   # 每天 UTC 01:30（北京 09:30）
  workflow_dispatch: {}      # 可手动触发

permissions:
  contents: write            # 允许把 last-good.txt 自动提交回仓库

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析最新版本并判断是否变化
        id: ver
        run: |
          # npm view 偶发超时，重试 3 次
          CODEX=""
          for i in 1 2 3; do
            CODEX="$(npm view @openai/codex version 2>/dev/null)" || CODEX=""
            [ -n "$CODEX" ] && break
            echo "npm view codex 第 $i 次失败，10s 后重试..."
            sleep 10
          done
          if [ -z "$CODEX" ]; then
            echo "::error::无法解析 @openai/codex 最新版本（网络问题）"
            exit 1
          fi
          # subagent 版本是信息性的，失败不阻塞
          SUB="$(npm view @deepseek-ai/dsh-subagent-codex dist-tags.next 2>/dev/null || echo unknown)"
          LAST="$(cat last-good.txt)"
          echo "codex=$CODEX" >> "$GITHUB_OUTPUT"
          echo "subagent=$SUB" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          if [ "$LAST" = "$CODEX" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "codex=$CODEX subagent=$SUB last-good=$LAST"

      - name: 安装 codex
        run: |
          npm install --no-save --fetch-retries=3 --fetch-retry-mintimeout=2000 \
            "@openai/codex@${{ steps.ver.outputs.codex }}"
          node -e "console.log('installed codex', require('@openai/codex/package.json').version)"

      - name: 跑协议探针
        run: node probe.mjs

      - name: 记录已验证版本
        if: success() && steps.ver.outputs.changed == 'true'
        run: |
          echo "${{ steps.ver.outputs.codex }}" > last-good.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-good.txt
          git commit -m "chore: codex ${{ steps.ver.outputs.codex }} 协议验证通过" || echo "无变更"
          git push

      - name: 邮件：新版本验证通过
        if: success() && steps.ver.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ codex ${{ steps.ver.outputs.codex }} 协议兼容，无需操作"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            @openai/codex@${{ steps.ver.outputs.codex }} 与 dsh-subagent-codex@${{ steps.ver.outputs.subagent }} 的 app-server 握手通过。

            无需操作：容器默认跟随 latest，下次重启/rebuild 会自动用上 ${{ steps.ver.outputs.codex }}。

      - name: 邮件：协议不兼容 / 检测失败
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ codex ${{ steps.ver.outputs.codex }} 检测失败，建议 pin"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            针对 @openai/codex@${{ steps.ver.outputs.codex }}（subagent-codex@${{ steps.ver.outputs.subagent }}）的协议检测失败。

            ⚠️ 容器默认跟随 latest，下次重启可能拉到坏版本。
            请立即在生产 docker-compose.yml 设：
              DSH_CODEX_OVERRIDE_VERSION=${{ steps.ver.outputs.last }}
            冻结在上一个已知可用版本，等 subagent-codex 上游适配。

            （若只是网络问题，先重跑一次；仍红再看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）
